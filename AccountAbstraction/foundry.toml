[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    "@eth-infinitism/account-abstraction/contracts/=lib/account-abstraction/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-5.3.0/contracts/"
]

